<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <title>Connecting Your Calendar • Smart Assistant</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif']
          }
        }
      }
    }
  </script>

  <style>
    .aurora-container {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 0;
      background-color: #060913;
    }

    .aurora-blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(100px);
      opacity: 0.4;
      mix-blend-mode: screen;
    }

    .blob-1 {
      width: 50vw; height: 50vw;
      background: radial-gradient(circle, rgba(99, 102, 241, 0.7) 0%, transparent 70%);
      top: 10%; left: 25%;
      animation: pulse-slow 8s ease-in-out infinite alternate;
    }

    @keyframes pulse-slow {
      0%   { transform: scale(1); opacity: 0.3; }
      100% { transform: scale(1.15); opacity: 0.5; }
    }

    /* Calming Sync Orbit Ring Animation */
    .sync-orbit {
      position: relative;
      width: 140px;
      height: 140px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto;
    }

    .orbit-ring-outer {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 2px dashed rgba(99, 102, 241, 0.35);
      animation: spin-slow 14s linear infinite;
    }

    .orbit-ring-inner {
      position: absolute;
      inset: 14px;
      border-radius: 50%;
      border: 2px solid transparent;
      border-top-color: #818cf8;
      border-right-color: #38bdf8;
      animation: spin-reverse 3.5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }

    .scanning-laser {
      position: absolute;
      width: 100%;
      height: 2px;
      background: linear-gradient(90deg, transparent, #818cf8, transparent);
      top: 0;
      animation: scan 2.2s ease-in-out infinite alternate;
    }

    @keyframes spin-slow {
      100% { transform: rotate(360deg); }
    }

    @keyframes spin-reverse {
      100% { transform: rotate(-360deg); }
    }

    @keyframes scan {
      0%   { top: 15%; opacity: 0.2; }
      50%  { opacity: 0.9; }
      100% { top: 85%; opacity: 0.2; }
    }

    .glass-card {
      background: rgba(13, 18, 30, 0.7);
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
    }
  </style>
</head>
<body class="text-slate-200 min-h-screen font-sans antialiased relative overflow-hidden flex items-center justify-center p-6">

  <div class="aurora-container">
    <div class="aurora-blob blob-1"></div>
  </div>

  <!-- Loading Card -->
  <div class="relative z-10 max-w-sm w-full glass-card rounded-3xl p-8 text-center space-y-6">

    <!-- Animated Orbit & Calendar Visual -->
    <div class="sync-orbit">
      <div class="orbit-ring-outer"></div>
      <div class="orbit-ring-inner"></div>

      <!-- Calendar Center Tile -->
      <div class="relative w-16 h-16 rounded-2xl bg-indigo-600/20 border border-indigo-400/40 text-indigo-300 flex items-center justify-center shadow-lg overflow-hidden">
        <i data-lucide="calendar" class="w-8 h-8"></i>
        <div class="scanning-laser"></div>
      </div>
    </div>

    <!-- Status Messages -->
    <div class="space-y-2">
      <h2 id="sync-title" class="text-lg font-bold text-white tracking-tight">Signing in...</h2>
      <p id="sync-subtitle" class="text-xs text-slate-400 transition-all duration-300">
        Connecting your Google Account securely
      </p>
    </div>

    <!-- Progress Indicator -->
    <div class="w-full bg-white/5 rounded-full h-1.5 overflow-hidden p-0.5 border border-white/5">
      <div id="sync-bar" class="h-full bg-gradient-to-r from-indigo-500 via-sky-400 to-emerald-400 rounded-full w-1/4 transition-all duration-700 ease-out"></div>
    </div>

    <p class="text-[11px] text-slate-500 font-medium">
      Almost ready • Preparing your workspace
    </p>

  </div>

  <script>
    lucide.createIcons();

    // Friendly rolling status messages
    const stages = [
      { pct: "35%",  title: "Account Authorized", subtitle: "Connecting Gmail and Google Calendar..." },
      { pct: "75%",  title: "Warming Assistant",  subtitle: "Initializing autonomous background watcher..." },
      { pct: "100%", title: "Ready!",             subtitle: "Welcome to your smart calendar assistant." }
    ];

    let current = 0;
    const interval = setInterval(() => {
      if (current < stages.length) {
        const item = stages[current];
        document.getElementById('sync-bar').style.width = item.pct;
        document.getElementById('sync-title').innerText = item.title;
        document.getElementById('sync-subtitle').innerText = item.subtitle;
        current++;
      } else {
        clearInterval(interval);
        window.location.href = "/";
      }
    }, 700);
  </script>
</body>
</html>
